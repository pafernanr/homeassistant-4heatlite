get_schedule:
  name: Get Schedule
  description: Read the current heating schedule (H24 or CCS) from the stove module. The result includes a protocol key.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: Target stove (optional if only one configured).
      required: false
      selector:
        text:

set_schedule:
  name: Set Schedule
  description: Write a heating schedule (H24 or CCS) to the stove module. The stove stores one schedule at a time; writing replaces it.
  fields:
    config_entry_id:
      name: Config Entry ID
      description: Target stove (optional if only one configured).
      required: false
      selector:
        text:
    protocol:
      name: Protocol
      description: "Schedule protocol: h24 (default) or ccs. Not every stove supports both."
      required: false
      default: h24
      selector:
        select:
          options:
            - h24
            - ccs
    schedule:
      name: Schedule
      description: "H24: temperatures (mapping with eco, normal and warm in °C) and slots (list with days, from, to, temperature: eco, normal or warm). CCS: period (daily, weekly or weekend) plus daily_slots, weekly_slots, or workday_slots and weekend_slots."
      required: true
      selector:
        object:
    program_index:
      name: Program Index
      description: "Schedule slot (0, 1, or 2). Matches the app's Schedule 1/2/3."
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 2
          mode: box
